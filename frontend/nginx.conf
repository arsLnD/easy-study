# Отдаём SPA: любой путь без совпадающего файла отдаёт index.html, чтобы
# работала клиентская маршрутизация React Router (/plan, /tracker и т.д.
# должны открываться и при прямом заходе по URL / обновлении страницы).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем запросы фронтенда к /api на backend-контейнер, чтобы
    # приложению не нужно было знать реальный адрес API (используется тот же
    # origin, что и у самого фронтенда — упрощает CORS и деплой).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
