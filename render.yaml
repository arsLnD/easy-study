services:
  - type: web
    name: plans-finance-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://easy-study.vercel.app,https://plans-finance.vercel.app"
      - key: OPENROUTER_API_KEY
        sync: false
